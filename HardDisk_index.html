<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Disco Rígido Interativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400,500,600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 w-full max-w-3xl rounded-2xl shadow-2xl p-6 md:p-8">
        
        <!-- topo e escolha do tamanho do disco -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-800 gap-4">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
                    </svg>
                    Simulador de Disco Rígido
                </h1>
                <p class="text-xs text-slate-400 mt-1">Função: <span class="text-indigo-300 font-mono font-semibold">E(X) = 200X + 500</span> (em MB)</p>
            </div>
            
            <!-- valores reais em megabytes -->
            <div class="w-full sm:w-auto">
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Tamanho do Disco</label>
                <select id="diskCapacity" class="bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-40">
                    <option value="262144">256 GB</option>
                    <option value="524288">512 GB</option>
                    <option value="1048576" selected>1 TB</option>
                    <option value="2097152">2 TB</option>
                </select>
            </div>
        </header>

        <!-- controle dos downloads -->
        <div class="my-6 bg-slate-800/50 border border-slate-800 rounded-2xl p-5">
            <div class="flex justify-between items-center mb-3">
                <div>
                    <h2 class="text-sm font-semibold text-white">Baixar Vídeos</h2>
                    <p class="text-xs text-slate-400">Quantidade de arquivos baixados (<span class="font-mono text-indigo-300">X</span>)</p>
                </div>
                <span id="videoCountDisplay" class="bg-indigo-600/30 text-indigo-300 px-3 py-1 rounded-full text-xs font-bold border border-indigo-500/30">X = 5 vídeos</span>
            </div>

            <!-- slider e botoes de atalho -->
            <div class="space-y-4">
                <input type="range" id="videoSlider" min="0" max="3000" value="5" class="w-full accent-indigo-500 cursor-pointer">
                
                <div class="grid grid-cols-3 gap-2 pt-2">
                    <button id="btnAddVideo" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition duration-150 shadow-md">
                        + 1 Vídeo
                    </button>
                    <button id="btnAddBatch" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition duration-150">
                        + 50 Vídeos
                    </button>
                    <button id="btnReset" class="bg-rose-900/30 hover:bg-rose-900/50 text-rose-300 border border-rose-800/50 text-xs font-semibold py-2.5 px-3 rounded-xl transition duration-150">
                        Zerar
                    </button>
                </div>
            </div>
        </div>

        <!-- barra visual e estatisticas -->
        <div class="space-y-5">
            <div>
                <div class="flex justify-between text-xs font-medium mb-2">
                    <span class="text-slate-400">Uso do Armazenamento</span>
                    <span id="usagePercentage" class="text-indigo-400 font-bold">0.0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-4 overflow-hidden p-0.5 border border-slate-700">
                    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3.5">
                    <span class="text-xs text-slate-400 block mb-1">Capacidade Total</span>
                    <span id="totalSpaceText" class="text-sm font-bold text-white">-</span>
                </div>
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3.5">
                    <span class="text-xs text-slate-400 block mb-1">Espaço Ocupado</span>
                    <span id="usedSpaceText" class="text-sm font-bold text-indigo-400">-</span>
                </div>
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3.5">
                    <span class="text-xs text-slate-400 block mb-1">Espaço Livre</span>
                    <span id="freeSpaceText" class="text-sm font-bold text-emerald-400">-</span>
                </div>
            </div>
        </div>

        <!-- mensagem se encher o disco todo -->
        <div id="alertBox" class="hidden mt-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs rounded-xl text-center font-medium">
            Disco cheio! Não cabe mais nenhum arquivo.
        </div>

    </div>

    <script src="script.js" defer></script>
</body>
</html>
